# Serverless backend: every 2 hours, find new recruitment notifications, read their
# PDFs with Gemini and publish the results for the app. Admit card / answer key /
# result notices also come every 30 minutes from notices.yml (no AI).
#
#   data branch (force-pushed, one commit, no history):
#     jobs.json      open jobs with eligibility rules  -> the app's feed
#     notices.json   admit card / exam date / answer key / result notices -> exam watcher
#     status.json    what the last run did
#     state/         database dump the next run continues from (which links are known)
#
# The app reads these files from GitHub Pages when it is switched on (Settings -> Pages ->
# Deploy from a branch -> "data" / root), and from raw.githubusercontent.com otherwise:
# some Indian ISPs (Jio, at times) block raw.githubusercontent.com.
#
# Needs one repository secret: GEMINI_API_KEY (Google AI Studio). Without it the run
# still crawls and publishes; new PDFs wait until the key is added. Optional second
# secret: MISTRAL_API_KEY, read once Gemini's free quota is used up for the day.
#
# Run it by hand: Actions -> "Data pipeline" -> Run workflow.

name: Data pipeline

on:
  schedule:
    - cron: "17 */2 * * *" # 00:17, 02:17 … UTC (GitHub may start scheduled runs late)
  workflow_dispatch:
    inputs:
      fresh_start:
        description: "Ignore saved state and start from scratch"
        type: boolean
        default: false

permissions:
  contents: write # push the data branch
  actions: write # keep this scheduled workflow switched on (last step)

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  run:
    # Pinned: ubuntu-latest moves to a new release in Oct 2026, and this job relies on the
    # image's preinstalled PostgreSQL.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DATABASE_URL: postgresql+asyncpg://tracker:tracker@localhost:5432/tracker
      PGURL: postgresql://tracker:tracker@localhost:5432/tracker
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'unset' }}
      # Override with a repository variable if Google renames things again.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
      # Used in turn when the main model is out of daily quota. Each model has its own free
      # quota (about 20 requests a day), and each request reads up to 3 notifications.
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite' }}
      # Optional backup once every Gemini model is out of quota (Mistral's free tier).
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || '' }}
      MISTRAL_MODELS: ${{ vars.MISTRAL_MODELS || 'ministral-14b-latest,ministral-8b-latest,mistral-small-latest' }}
      UPLOAD_DIR: /tmp/notifications
      # The server-only settings still need values to load the shared config.
      API_KEY: not-used-in-pipeline
      JWT_SECRET: not-used-in-the-pipeline-but-must-be-32-chars-long
      GOOGLE_CLIENT_IDS: '[]'
      # Runs are 2 h apart; slightly shorter so every source is due on every run.
      CRAWL_INTERVAL_HOURS: "1.75"
      CRAWL_JITTER_MINUTES: "10"
      # Job pages are cheap to open (no Gemini). 40 a run, 12 runs a day: as many visits
      # to the job sites as 80 every 4 hours.
      AGGREGATOR_DETAIL_PAGES_PER_RUN: "40"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: |
          pip install -r backend/requirements.txt
          # No user data is stored here, but the shared config wants a valid Fernet key.
          echo "VAULT_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -qc "CREATE USER tracker WITH SUPERUSER PASSWORD 'tracker';"
          sudo -u postgres psql -qc "CREATE DATABASE tracker OWNER tracker;"

      - name: Restore last run's state
        if: ${{ !inputs.fresh_start }}
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            want=$(python -c "import sys; sys.path.insert(0,'backend'); from app.services.publish import SCHEMA_VERSION as v; print(v)")
            have=$(git show FETCH_HEAD:state/schema 2>/dev/null || echo none)
            if [ "$want" = "$have" ]; then
              git show FETCH_HEAD:state/db.sql.gz | gunzip | psql -q "$PGURL" >/dev/null
              echo "Restored state (schema $have)."
              # Its notice labels (Mistral's) are reused, not asked again.
              git show FETCH_HEAD:notices.json > /tmp/previous_notices.json 2>/dev/null || true
            else
              echo "::notice::Saved state is schema $have, code wants $want: starting fresh."
            fi
          else
            echo "No data branch yet: first run."
          fi

      - name: Crawl, read PDFs, publish
        working-directory: backend
        run: python scripts/run_pipeline.py --out ../publish --previous /tmp/previous_notices.json

      # Private workspace (optional module, backend/app/modules/private_jobs): its own
      # step, after the Govt data is built, so a failure here never blocks it. The last
      # published file is handed over, so a bad run keeps the app's feed as it was.
      # Off when the repository variable ENABLE_PRIVATE_JOBS is 'false'.
      - name: Private jobs (company job boards)
        if: ${{ vars.ENABLE_PRIVATE_JOBS != 'false' }}
        continue-on-error: true
        timeout-minutes: 10
        working-directory: backend
        run: |
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:private_jobs.json > /tmp/previous_private_jobs.json 2>/dev/null || true
          fi
          python -m app.modules.private_jobs --out ../publish/private_jobs.json --previous /tmp/previous_private_jobs.json

      - name: Save state
        run: |
          mkdir -p publish/state
          pg_dump --no-owner --no-privileges "$PGURL" | gzip -9 > publish/state/db.sql.gz
          python -c "import sys; sys.path.insert(0,'backend'); from app.services.publish import SCHEMA_VERSION as v; print(v)" > publish/state/schema
          ls -la publish publish/state
          cat publish/status.json

      - name: Push the data branch
        working-directory: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '# Generated by .github/workflows/data-pipeline.yml. Do not edit.\n' > README.md
          cp -r ../site/. . # home page + privacy policy for Google sign-in (GitHub Pages)
          touch .nojekyll # GitHub Pages serves the files as they are, without a Jekyll build
          git init -q -b data
          git config user.name "JobSummit pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      # GitHub switches off scheduled workflows in public repositories after 60 days without
      # repository activity. Re-enabling through the API (no commits) keeps it on.
      - name: Keep the schedule switched on
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data-pipeline.yml/enable"

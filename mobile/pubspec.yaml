name: exam_tracker
description: ADHD-first tracker for Indian Govt/PSU recruitment exams.
publish_to: "none"
# +N is the release number the in-app updater compares (see RELEASING.md).
version: 0.21.1+37

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Offline storage
  sqflite: ^2.4.1
  path: ^1.9.0
  # Android Keystore-backed storage for portal passwords (never in SQLite)
  flutter_secure_storage: ^9.2.4

  # System integration
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  url_launcher: ^6.3.1

  # Network
  http: ^1.2.2

  # Account: Google sign-in (Credential Manager on Android) -> backend JWTs
  google_sign_in: ^7.2.0
  # Android 13+ notification permission prompt
  permission_handler: ">=11.3.1 <13.0.0"

  # In-app updates (direct/GitHub flavour only; disabled in store builds)
  self_update:
    path: packages/self_update
  package_info_plus: ^9.0.1
  device_info_plus: ^11.1.0
  shared_preferences: ^2.3.3
  workmanager: ^0.10.10
  flutter_local_notifications: ^18.0.1
  html: ^0.15.7
  flutter_svg: ^2.3.0
  share_plus: ^12.0.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_picker: 10.3.3
  archive: ^4.5.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  share_plus_platform_interface: ^6.1.0

flutter:
  uses-material-design: true

  # Nunito (SIL Open Font License, assets/fonts/Nunito-OFL.txt): rounded and friendly.
  # Static weights cut from the variable font, so bold text is really bold on Android.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
